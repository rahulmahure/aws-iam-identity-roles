name: Terraform Destroy - ALL Environments

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY-ALL to confirm deletion of DEV, TEST and PROD'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:

  # ============================================================
  # DESTROY DEV
  # ============================================================

  destroy-dev:
    name: Destroy DEV
    if: github.event.inputs.confirmation == 'DESTROY-ALL'
    runs-on: ubuntu-latest

    environment: dev

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "DEV AWS ACCOUNT"
          echo "=========================================="
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/dev.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -out=dev-destroy.tfplan \
            -no-color

      - name: Terraform Destroy
        run: |
          terraform apply \
            -auto-approve \
            dev-destroy.tfplan


  # ============================================================
  # DESTROY TEST
  # ============================================================

  destroy-test:
    name: Destroy TEST
    needs: destroy-dev
    if: github.event.inputs.confirmation == 'DESTROY-ALL'
    runs-on: ubuntu-latest

    environment: test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "TEST AWS ACCOUNT"
          echo "=========================================="
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/test.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -out=test-destroy.tfplan \
            -no-color

      - name: Terraform Destroy
        run: |
          terraform apply \
            -auto-approve \
            test-destroy.tfplan


  # ============================================================
  # DESTROY PROD
  # ============================================================

  destroy-prod:
    name: Destroy PROD
    needs: destroy-test
    if: github.event.inputs.confirmation == 'DESTROY-ALL'
    runs-on: ubuntu-latest

    environment: prod

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "PROD AWS ACCOUNT"
          echo "=========================================="
          aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config=backend/prod.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: |
          terraform plan \
            -destroy \
            -out=prod-destroy.tfplan \
            -no-color

      - name: Terraform Destroy
        run: |
          terraform apply \
            -auto-approve \
            prod-destroy.tfplan